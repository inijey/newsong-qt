<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEWSONG QT</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NEWSONG QT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<!-- 서브셋에 없는 드문 글자만 같은 프리텐다드 웹폰트로 채워요 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');</script>
<style>
  @font-face{font-family:'PretendardQT';font-weight:400;font-display:swap;src:url(fonts/PretendardQT-400.woff2) format('woff2')}
  @font-face{font-family:'PretendardQT';font-weight:600;font-display:swap;src:url(fonts/PretendardQT-600.woff2) format('woff2')}
  @font-face{font-family:'PretendardQT';font-weight:800;font-display:swap;src:url(fonts/PretendardQT-800.woff2) format('woff2')}
  @font-face{font-family:'PretendardQT';font-weight:900;font-display:swap;src:url(fonts/PretendardQT-900.woff2) format('woff2')}

  :root{ --ink:#111; --ink-2:#444; --ink-3:#8a8a8a; --line:#e4e4e4; --bg:#f4f4f2; --card:#fff; --fs:16px; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PretendardQT","Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;word-break:keep-all}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  [hidden]{display:none!important}

  /* 상단 바 */
  .bar{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:env(safe-area-inset-top) 16px 0}
  .bar-in{max-width:1120px;margin:0 auto;height:56px;display:flex;align-items:center;gap:12px}
  .brand{flex:1;display:flex;align-items:center;gap:10px;white-space:nowrap;min-width:0}
  .brand img{height:30px;width:auto;display:block}
  .brand span{font-weight:900;font-size:19px;letter-spacing:-.01em}
  .nav{display:flex;align-items:center;gap:4px}
  .nav button{width:36px;height:36px;border-radius:8px;display:grid;place-items:center}
  .nav button:disabled{opacity:.25;cursor:default}
  .nav .d{font-weight:700;font-size:15px;min-width:150px;text-align:center;font-variant-numeric:tabular-nums}
  .side{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:8px}
  .today{border:1px solid #555;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
  .me{width:34px;height:34px;border-radius:50%;border:1px solid #555;display:grid;place-items:center;font-weight:800;font-size:13px}
  @media (hover:hover){ .nav button:hover:not(:disabled){background:#2a2a2a} .today:hover,.me:hover{background:#fff;color:var(--ink)} }

  /* 도구줄 */
  .tools{max-width:1120px;margin:14px auto 0;padding:0 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .seg{display:none;background:#e7e7e4;border-radius:10px;padding:3px}
  .seg button{white-space:nowrap;padding:7px 16px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-3)}
  .seg button.on{background:var(--ink);color:#fff}
  .tools > .collect{margin-left:auto}
  .zoom{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;height:32px}
  .zoom button{width:32px;height:30px;font-weight:700}
  .zoom span{font-size:12.5px;font-weight:600;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}

  /* 본문 */
  main{max-width:1120px;margin:0 auto;padding:16px 16px 120px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px}
  .head{padding:6px 2px 18px}
  .eyebrow{font-size:13px;color:var(--ink-3);font-weight:600}
  h1{font-size:calc(var(--fs) * 1.6);line-height:1.3;margin:6px 0 0;letter-spacing:-.03em;font-weight:800}
  .range{display:inline-block;margin-left:8px;font-size:calc(var(--fs) * .9);font-weight:600;color:var(--ink-2);vertical-align:middle}
  .tong{margin-top:14px;display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--ink);border-radius:999px;padding:7px 14px 7px 10px;font-size:14px;font-weight:600}
  .tong.done{background:var(--ink);color:#fff}
  .box{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center}
  .tong.done .box{background:#fff;color:var(--ink);border-color:#fff}
  .tong .box svg{opacity:0}.tong.done .box svg{opacity:1}
  .pray{padding:16px 18px;display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
  .pill{flex:none;background:var(--ink);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;margin-top:1px}
  .pray p{margin:0;font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--ink-2)}
  .bible{padding:22px 22px 18px}
  .bible .hd{font-size:calc(var(--fs) * .88);color:var(--ink-3);margin:0 0 14px}
  .v{margin:0 0 .75em;font-size:var(--fs);line-height:1.8}
  .v b{font-weight:800;margin-right:6px;font-size:.82em;font-variant-numeric:tabular-nums}
  details{border-top:1.5px solid var(--ink);margin-top:22px}
  summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:12px 2px;font-weight:800;font-size:15px}
  summary::-webkit-details-marker{display:none}
  summary i{font-style:normal;font-weight:500;color:var(--ink-3);font-size:13px}
  details[open] summary i::after{content:'접기'} details:not([open]) summary i::after{content:'펼치기'}
  .exp{padding:0 2px 6px;font-size:calc(var(--fs) * .95);line-height:1.85;color:var(--ink-2);white-space:pre-line;margin:0}
  /* 역본 탭 · 장 구분 */
  .vtabs{display:flex;gap:4px;background:#e7e7e4;border-radius:12px;padding:3px;margin:0 0 10px}
  .vtabs button{flex:1;padding:8px 6px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--ink-3);white-space:nowrap}
  .vtabs button.on{background:var(--ink);color:#fff}
  .chap{font-size:12.5px;font-weight:800;color:var(--ink-3);letter-spacing:.04em;margin:18px 0 8px;display:flex;align-items:center;gap:10px}
  .chap::after{content:'';flex:1;height:1px;background:var(--line)}
  .chap:first-of-type{margin-top:4px}
  .nav .d{cursor:pointer;border-radius:8px;padding:6px 8px;white-space:nowrap;color:#fff;display:block;width:auto;height:auto}
  .nav .d::after{content:' ▾';font-size:10px;opacity:.6}
  @media (hover:hover){ .nav .d:hover{background:#2a2a2a} }
  /* 달력 */
  .cal-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
  .cal-h b{font-size:17px}
  .cal-h button{width:40px;height:40px;border-radius:10px;font-size:18px}
  .cal-h button:disabled{opacity:.2}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .cal .w{font-size:12px;color:var(--ink-3);font-weight:700;padding:4px 0}
  .cal .w:first-child{color:#c0392b}
  .cal button{aspect-ratio:1;border-radius:12px;font-size:15px;font-weight:700;position:relative;display:grid;place-items:center}
  .cal button:disabled{color:#c8c8c8;font-weight:500;cursor:default}
  .cal button.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
  .cal button.cur{background:var(--ink);color:#fff}
  .cal button.wr::after{content:'';position:absolute;bottom:6px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
  .cal-legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--ink-3);margin-top:12px}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px}
  .cal-legend i{width:5px;height:5px;border-radius:50%;background:var(--ink);display:inline-block}
  .cal-legend em{width:14px;height:14px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--ink);display:inline-block}
  /* 하이라이트 */
  .v{cursor:pointer;border-radius:6px;margin-left:-6px;margin-right:-6px;padding:2px 6px;transition:background .12s}
  .v span{transition:background .12s}
  .v.hl span{background:linear-gradient(transparent 40%, #FAFAD2 40%, #FAFAD2 92%, transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .v.ul span{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
  .v.sel{background:#ececea;outline:1.5px solid var(--ink)}
  .bible .tip{font-size:12px;color:var(--ink-3);margin:-4px 0 12px}
  .mtool{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;background:var(--ink);color:#fff;
    border-radius:16px;padding:6px;display:flex;gap:2px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100vw - 24px)}
  .mtool button{white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border-radius:11px;font-size:12px;font-weight:600;min-width:58px}
  .mtool button:active{background:#2a2a2a}
  .mtool .sw{width:22px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:13px;font-weight:800}
  .mtool .sw.hl{background:#FAFAD2;color:#111} .mtool .sw.ul{text-decoration:underline;text-underline-offset:3px}
  .mtool .cnt{align-self:center;font-size:12px;opacity:.6;padding:0 8px 0 6px;white-space:nowrap}
  .collect{height:32px;border-radius:999px;padding:0 13px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .collect i{width:12px;height:9px;border-radius:2px;background:#FAFAD2;display:block}
  /* 모아보기 */
  .full{position:fixed;inset:0;z-index:35;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
  .full .bar-in{justify-content:space-between}
  .full .x{width:36px;height:36px;font-size:22px;color:#fff}
  .hlist{max-width:720px;margin:0 auto;padding:18px 16px 60px}
  .hgroup{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;cursor:pointer}
  .hgroup .hd2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
  .hgroup .hd2 b{font-size:15px}
  .hgroup .hd2 small{font-size:12px;color:var(--ink-3);white-space:nowrap}
  .hgroup .v{cursor:inherit;margin:0 0 .4em;padding:0;font-size:calc(var(--fs) * .95)}
  .write{position:sticky;top:76px}
  .btn.icon{padding:0 16px;flex:none}
  .posted{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:600}
  .posted a{color:var(--ink)}
  .steps{display:grid;gap:10px;margin-top:6px}
  .step{border:1.5px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
  .step.done{border-color:var(--ink);background:#fafafa}
  .step .t{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
  .step .t i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12.5px;flex:none}
  .step.done .t i{background:#2e7d32}
  .step .pv{font-size:13.5px;color:var(--ink-2);line-height:1.55;background:#f4f4f2;border-radius:10px;padding:10px 12px;white-space:pre-line;max-height:84px;overflow:hidden}
  .head-pill{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:800;margin:0 2px}
  .gate select{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:16px;background:#fafafa;margin-bottom:10px;color:var(--ink)}
  .sheet select{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:16px;background:#fafafa}
  .sheet .sec-t{font-size:13px;font-weight:800;margin:18px 0 8px;color:var(--ink-2)}
  .sheet{max-height:88vh;overflow:auto}
  .f{margin-bottom:18px}
  .f label{display:block;font-weight:800;font-size:15px;margin:0 0 8px}
  .f label small{display:block;font-weight:500;color:var(--ink-3);font-size:12.5px;margin-top:3px;line-height:1.5}
  textarea{width:100%;min-height:150px;resize:none;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#fff;
    padding:14px 16px;font:inherit;font-size:max(16px,var(--fs));line-height:1.75;color:var(--ink);outline:none;transition:border-color .15s}
  textarea:focus{border-color:var(--ink)}
  textarea.big{min-height:220px}
  .acts{display:flex;gap:10px;align-items:center}
  .btn{height:50px;border-radius:12px;font-weight:700;font-size:15px;padding:0 20px}
  .btn.pri{background:var(--ink);color:#fff;flex:1}
  .btn.sec{border:1.5px solid var(--ink);background:#fff}
  .btn:disabled{opacity:.45}
  .status{font-size:12.5px;color:var(--ink-3);margin-top:10px;min-height:18px}
  .to-write{display:none;width:100%;margin-top:28px}
  .empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--ink-2)}
  .empty h2{font-size:20px;margin:0 0 8px;color:var(--ink)}
  .empty .btn{margin-top:18px}

  /* 시작·신청 화면 */
  .gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
  .gate-in{width:100%;max-width:380px;text-align:center}
  .gate .logo{width:132px;margin:0 auto 14px;display:block}
  .gate h2{font-size:26px;font-weight:900;margin:0;letter-spacing:-.01em}
  .gate .sub{color:var(--ink-3);font-size:14px;margin:6px 0 34px;line-height:1.6}
  .gate .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;text-align:left}
  .gate .panel h3{font-size:17px;margin:0 0 6px}
  .gate .panel p{font-size:13.5px;color:var(--ink-2);line-height:1.65;margin:0 0 16px}
  .gate input{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;outline:none;margin-bottom:10px;background:#fafafa}
  .gate input:focus{border-color:var(--ink);background:#fff}
  .gate input.code{text-transform:uppercase;letter-spacing:.12em;font-weight:700;text-align:center}
  .gate .btn{width:100%}
  .gate .stack{display:grid;gap:10px}
  .gate .link{display:block;margin:16px auto 0;font-size:13.5px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
  .gate .err{color:#b42318;font-size:13px;min-height:18px;margin:-2px 0 8px}
  .codebox{font-weight:800;letter-spacing:.14em;font-size:20px;text-align:center;padding:14px;border:1.5px dashed var(--ink);border-radius:12px;margin:4px 0 12px;font-variant-numeric:tabular-nums}

  /* 메뉴 시트 */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom))}
  @media (min-width:600px){ .scrim{align-items:center} .sheet{border-radius:18px} }
  .sheet h3{margin:0 0 4px;font-size:18px}
  .sheet .muted{color:var(--ink-3);font-size:13px;line-height:1.6;margin:0 0 14px}
  .sheet .row{display:grid;gap:10px;margin-top:14px}

  /* 홈 화면 추가 안내 */
  .hint{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:25;background:var(--ink);color:#fff;border-radius:14px;
    padding:14px 44px 14px 16px;font-size:13.5px;line-height:1.55;max-width:460px;margin:0 auto}
  .hint b{font-weight:800}
  .hint button{position:absolute;right:8px;top:8px;width:30px;height:30px;color:#fff;font-size:18px}

  .toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translate(-50%,-12px);opacity:0;background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:.2s;pointer-events:none;z-index:40;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:880px){
    main{grid-template-columns:1fr;gap:0}
    .seg{display:flex}
    .write{position:static}
    body[data-tab="read"] .col-write{display:none}
    body[data-tab="write"] .col-read{display:none}
    .to-write{display:block}
    .brand{flex:none}
    .brand img{height:24px}
    .brand span{display:none}
    .nav .d{min-width:124px;font-size:14px}
    .today{padding:5px 10px}
    .seg button{padding:7px 11px}
    .tools{gap:8px}
    .zoom button{width:28px}
    .zoom span{min-width:36px}
    .mtool button{min-width:0;padding:8px 9px}
    .mtool .cnt{padding:0 4px}
    .hint{bottom:calc(82px + env(safe-area-inset-bottom))}
    .acts{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:5}
  }
</style>
</head>
<body data-tab="read">

<!-- 시작·신청·대기 화면 -->
<section class="gate" id="gate" hidden><div class="gate-in" id="gateIn"></div></section>

<!-- 본 앱 -->
<div id="app" hidden>
  <div class="bar"><div class="bar-in">
    <div class="brand"><img src="icons/logo-white.svg" alt="NEWSONG"><span>NEWSONG QT</span></div>
    <div class="nav">
      <button id="prev" aria-label="이전 날짜"><svg width="10" height="12" viewBox="0 0 10 12"><path d="M9 1 2 6l7 5z" fill="currentColor"/></svg></button>
      <button class="d" id="dateLabel" aria-label="날짜 선택">불러오는 중</button>
      <button id="next" aria-label="다음 날짜"><svg width="10" height="12" viewBox="0 0 10 12"><path d="m1 1 7 5-7 5z" fill="currentColor"/></svg></button>
    </div>
    <div class="side">
      <button class="today" id="goToday">오늘</button>
      <button class="me" id="meBtn" aria-label="내 정보">나</button>
    </div>
  </div></div>
  <div class="tools">
    <div class="seg" role="tablist">
      <button class="on" data-t="read">말씀</button>
      <button data-t="write">묵상 쓰기</button>
    </div>
    <button class="collect" id="collectBtn"><i></i>모아보기</button>
    <div class="zoom" style="margin-left:0"><button id="zo" aria-label="글자 작게">−</button><span id="zv">100%</span><button id="zi" aria-label="글자 크게">+</button></div>
  </div>
  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═════════ 서버 연결 ═════════
 * 화면은 api() 하나로만 서버와 이야기해요.
 * 나중에 저장소를 Supabase 등으로 옮기면 이 부분만 바꾸면 돼요.
 */
const CFG = window.NQT_CONFIG || {};
const DEMO = /[?&]demo\b/.test(location.search);
const API_OK = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test((CFG.API_URL || '').trim());
let KEY = null, ME = null;

async function api(action, payload, opts){
  if (DEMO) return demoApi(action, payload || {});
  const res = await fetch(CFG.API_URL.trim(), {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   // 단순 요청(사전 확인 없이 바로 전송)
    body: JSON.stringify(Object.assign({action, key: KEY}, payload || {})),
    keepalive: !!(opts && opts.keepalive),
  });
  const j = await res.json();
  if (!j.ok){ const e = new Error(j.message || j.error); e.code = j.error; throw e; }
  return j;
}

/* ═════════ 저장소(이 기기) ═════════ */
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
const normKey = k => String(k || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
const fmtKey = k => { k = normKey(k); return k.length === 10 ? k.slice(0,5) + '-' + k.slice(5) : k; };

/* ═════════ 공통 ═════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let tt; function toast(m){ const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 1900); }
function copy(text, msg){
  const done = () => toast(msg || '복사했어요');
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e){} ta.remove(); done(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

/* ═════════ 빠른 화면: 이 기기에 저장해 둔 날짜를 먼저 보여주고, 뒤에서 새로 받아와요 ═════════ */
function localToday(){ const d = new Date(Date.now() + 9 * 3600e3); return d.toISOString().slice(0, 10); } // 한국 날짜
const dayKey = d => 'nqt.day.' + normKey(KEY) + '.' + d;
function cacheDay(r){
  if (!r || !r.date) return;
  store.set(dayKey(r.date), r);
  const idx = (store.get('nqt.days') || []).filter(d => d !== r.date); idx.unshift(r.date);
  idx.slice(14).forEach(d => store.del(dayKey(d)));   // 최근 14일만 보관
  store.set('nqt.days', idx.slice(0, 14));
}
let loadSeq = 0;
async function load(date, fresh){
  await flush();
  const target = date || localToday(), seq = ++loadSeq;
  const cached = fresh ? null : store.get(dayKey(target));
  if (fresh) { S = fresh; cacheDay(fresh); render(); prefetch(); return; }
  if (cached) { S = cached; render(); }
  else {
    $('#dateLabel').textContent = '불러오는 중';
    $('#main').innerHTML = '<div class="empty"><div class="spin"></div></div>';
  }
  try {
    const r = await api('day', {date: date || ''});
    if (seq !== loadSeq) return;                       // 그새 다른 날짜로 이동했으면 무시
    if (r.user) ME = r.user;
    cacheDay(r);
    if (!cached || dirty) {
      if (!cached) { S = r; render(); }
      else { S.qt = r.qt; S.prev = r.prev; S.next = r.next; S.user = r.user; }   // 작성 중이면 글은 건드리지 않아요
    } else if (JSON.stringify(r) !== JSON.stringify(cached)) {
      const y = window.scrollY; S = r; render(); window.scrollTo(0, y);
    }
    prefetch();
  } catch(e){
    if (seq !== loadSeq) return;
    if (handleAuthError(e)) return;
    if (!cached) $('#main').innerHTML = `<div class="empty"><h2>불러오지 못했어요</h2><p>${esc(e.message || '인터넷 연결을 확인해 주세요.')}</p><button class="btn pri" style="flex:none" onclick="load('${esc(date||'')}')">다시 시도</button></div>`;
    else toast('최신 내용을 불러오지 못했어요');
  }
}
/* 전날 묵상을 미리 받아둬서 ◀ 를 누르면 바로 열려요 */
function prefetch(){
  if (!S || !S.prev || store.get(dayKey(S.prev))) return;
  api('day', {date: S.prev}).then(cacheDay).catch(() => {});
}

function handleAuthError(e){
  if (e.code === 'NO_USER') { clearKey(); showWelcome('코드가 더 이상 유효하지 않아요. 다시 신청하거나 코드를 입력해 주세요.'); return true; }
  if (e.code === 'PENDING') { showPending(); return true; }
  if (e.code === 'BLOCKED') { showBlocked(); return true; }
  return false;
}

function fmtDate(d){
  const [y,m,dd] = d.split('-').map(Number);
  return `${y}. ${m}. ${dd} (${'일월화수목금토'[new Date(y, m-1, dd).getDay()]})`;
}
const cleanTitle = t => String(t || '').replace(/^\s*[월화수목금토일]요일\s*/, '');
function fullDate(d){
  const [y,m,dd] = d.split('-').map(Number);
  return `${y}년 ${m}월 ${dd}일 ${'일월화수목금토'[new Date(y, m-1, dd).getDay()]}요일`;

const draftKey = () => 'nqt.draft.' + normKey(KEY) + '.' + S.date;

/* 절 키는 '장:절'(23:1). 예전 기록('1')도 읽어요 */
const vKey = v => v.c ? v.c + ':' + v.n : String(v.n);
const markOf = (marks, v) => (marks || {})[vKey(v)] || (marks || {})[String(v.n)] || '';
const multiChap = q => new Set((q.verses || []).map(v => v.c).filter(Boolean)).size > 1;
const vLabel = (q, v) => multiChap(q) && v.c ? `${v.c}:${v.n}` : `${v.n}절`;

const VERS = [{ id:'NEW', name:'새번역' }, { id:'GAE', name:'개역개정' }, { id:'EASY', name:'쉬운성경' }, { id:'NIV', name:'NIV' }];
function curVer(q){
  const v = store.get('nqt.ver') || 'NEW';
  return v === 'NEW' || (q.versions && q.versions[v] && q.versions[v].length) ? v : 'NEW';
}
function bibleInner(q, marks){
  const ver = curVer(q);
  const avail = VERS.filter(x => x.id === 'NEW' || (q.versions && q.versions[x.id] && q.versions[x.id].length));
  const list = ver === 'NEW' ? (q.verses || []) : q.versions[ver];
  const multi = multiChap(q);
  let lastC = null;
  const rows = list.map(v => {
    let h = '';
    if (multi && v.c && v.c !== lastC) { h += `<p class="chap">${esc(v.c)}장</p>`; lastC = v.c; }
    return h + `<p class="v ${esc(markOf(marks, v))}" data-k="${esc(vKey(v))}"><b>${esc(v.n)}</b><span>${esc(v.text)}</span></p>`;
  }).join('');
  return `${avail.length > 1 ? `<div class="vtabs">${avail.map(x => `<button data-v="${x.id}" class="${x.id === ver ? 'on' : ''}">${x.name}</button>`).join('')}</div>` : ''}
    ${ver === 'NEW' && q.heading ? `<p class="hd">[${esc(q.heading)}]</p>` : ''}
    ${list.length ? '<p class="tip">절을 누르면 형광펜·밑줄을 칠 수 있어요</p>' : ''}
    ${rows}`;
}
function renderBible(){
  const box = $('#bible'); if (!box || !S || !S.qt) return;

    </div>

    <button class="btn pri to-write" id="toWrite">묵상 쓰러 가기</button>
  </section>
  <section class="col-write"><div class="write">
    <div class="f"><label for="word">와닿는 단어나 구절, 생각과 느낌</label><textarea id="word">${esc(my.word)}</textarea></div>

/* 저장: 입력 멈추고 2.5초 뒤 자동, 앱을 닫거나 다른 앱으로 갈 때도 저장 */
function collect(){ return { word: $('#word')?.value || '', god: $('#god')?.value || '', wrapup: $('#wrapup')?.value || '', tongdokDone: !!(S && S.my && S.my.tongdokDone), marks: (S && S.my && S.my.marks) || {} }; }
function onEdit(){
  dirty = true; autosize();
  store.set(draftKey(), Object.assign(collect(), {savedAt: Date.now()}));
  $('#status').textContent = '작성 중…';
  schedule();
}
function schedule(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => save(false), 2500); }
let saving = null;
async function save(manual, keepalive){
  clearTimeout(saveTimer);
  if (!S || !S.qt || !$('#word')) return;
  if (saving) await saving.catch(() => {});
  const data = collect(), date = S.date, dk = draftKey();
  saving = api('save', {date, data}, {keepalive});
  try {
    const r = await saving;
    dirty = false; store.del(dk);
    const cd = store.get(dayKey(date)); if (cd) { cd.my = Object.assign({}, cd.my, data, { updatedAt: r.updatedAt }); store.set(dayKey(date), cd); }
    if (S && S.date === date) { Object.assign(S.my, data); const st = $('#status'); if (st) st.textContent = '자동 저장됨 · ' + r.updatedAt; }
    if (manual) toast('임시저장했어요');
  } catch(e){
    if (handleAuthError(e)) return;
    const st = $('#status'); if (st) st.textContent = '저장 실패 — 이 기기에 임시 보관 중이에요';
    if (manual) toast('저장에 실패했어요. 잠시 후 다시 눌러주세요');
  } finally { saving = null; }
}
async function flush(){ if (dirty) await save(false); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && dirty) save(false, true); });

function copyNote(){
  const q = S.qt, d = collect();
  const parts = [`[${fmtDate(S.date)}] ${cleanTitle(q.title)}${q.range ? ' (' + q.range + ')' : ''}`];
  const marked = (q.verses || []).filter(v => markOf(d.marks, v));
  if (marked.length) parts.push('■ 표시한 구절\n' + marked.map(v => (multiChap(q) && v.c ? v.c + ':' : '') + v.n + ' ' + v.text).join('\n'));
  if (d.word)   parts.push('■ 와닿는 단어나 구절, 생각과 느낌\n' + d.word);
  if (d.god)    parts.push('■ 하나님에 대한 생각, 느낌, 깨달음\n' + d.god);
  if (d.wrapup) parts.push('■ 묵상 정리\n' + d.wrapup);

/* ═════════ 카페에 올리기 ═════════
 * 자동(네이버 연결된 계정): 서버가 네이버 카페 API로 바로 게시
 * 반자동(그 외): ① 제목 복사 + 글쓰기 화면 열기 → ② 본문 복사
 */
function postedHtml(p){
  if (!p) return '';
  return `<span class="posted">✓ 카페에 올림 · ${esc(p.text)}${p.url ? ` · <a href="${esc(p.url)}" target="_blank" rel="noopener">글 보기</a>` : ''}</span>`;
}
function composeTitle(){
  const b = ME.board, q = S.qt, [y, m, d] = S.date.split('-').map(Number);
  return (b.titleFormat || '{월}/{일}({요일}) {제목} ({범위})')
    .replace(/\{월\}/g, m).replace(/\{일\}/g, d).replace(/\{요일\}/g, '일월화수목금토'[new Date(y, m-1, d).getDay()])
    .replace(/\{제목\}/g, cleanTitle(q.title)).replace(/\{범위\}/g, q.range || '')
    .replace(/\{이름\}/g, ME.name || '').replace(/\{말머리\}/g, b.head || '')
    .replace(/\(\s*\)/g, '').replace(/\s+/g, ' ').trim();
}
function composeBody(){
  const q = S.qt, d = collect(), parts = [];
  const marked = (q.verses || []).filter(v => markOf(d.marks, v));
  if (marked.length) parts.push('■ 표시한 구절\n' + marked.map(v => (multiChap(q) && v.c ? v.c + ':' : '') + v.n + ' ' + v.text).join('\n'));
  if (d.word)   parts.push('■ 와닿는 단어나 구절, 생각과 느낌\n' + d.word);
  if (d.god)    parts.push('■ 하나님에 대한 생각, 느낌, 깨달음\n' + d.god);
  if (d.wrapup) parts.push('■ 묵상 정리\n' + d.wrapup);
  return parts.join('\n\n');
}
function sheet(html){
  document.querySelectorAll('.scrim').forEach(x => x.remove());
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog">${html}</div>`;
  document.body.appendChild(scrim);
  scrim.onclick = e => { if (e.target === scrim || e.target.closest('[data-close]')) scrim.remove(); };
  return scrim;
}

let selected = new Set();
function bindVerses(){
  selected = new Set(); hideTool();
  document.querySelectorAll('.bible .v').forEach(p => p.onclick = () => {
    if (window.getSelection && String(window.getSelection()).length) return; // 글자를 드래그 중이면 무시
    const k = p.dataset.k;
    if (selected.has(k)) { selected.delete(k); p.classList.remove('sel'); } else { selected.add(k); p.classList.add('sel'); }
    selected.size ? showTool() : hideTool();
  });
}
function showTool(){
  let t = $('#mtool');
  if (!t){
    t = document.createElement('div'); t.className = 'mtool'; t.id = 'mtool';
    t.innerHTML = `<span class="cnt" id="mcnt"></span>
      <button data-a="hl"><span class="sw hl">가</span>형광펜</button>
      <button data-a="ul"><span class="sw ul">가</span>밑줄</button>
      <button data-a="clear"><span class="sw">⌫</span>지우기</button>
      <button data-a="take"><span class="sw">＋</span>구절 담기</button>
      <button data-a="close"><span class="sw">✕</span>닫기</button>`;
    document.body.appendChild(t);
    t.onclick = e => { const b = e.target.closest('button'); if (b) markAction(b.dataset.a); };
  }
  $('#mcnt').textContent = selected.size + '절';
}
function hideTool(){ const t = $('#mtool'); if (t) t.remove(); }
function markAction(a){
  const q = S.qt, ver = curVer(q), list = ver === 'NEW' ? q.verses : q.versions[ver];
  const ks = list.map(vKey).filter(k => selected.has(k));   // 본문 순서대로
  if (a === 'take'){
    const txt = ks.map(k => { const v = list.find(v => vKey(v) === k); return v ? `${vLabel(q, v)} ${v.text}` : ''; }).filter(Boolean).join('\n');
    const w = $('#word'); w.value = (w.value.trim() ? w.value.replace(/\s+$/, '') + '\n' : '') + txt;
    onEdit(); toast('와닿는 구절 칸에 담았어요');
  } else if (a !== 'close'){
    ks.forEach(k => { delete S.my.marks[k]; delete S.my.marks[k.split(':').pop()]; if (a !== 'clear') S.my.marks[k] = a; });
    document.querySelectorAll('.bible .v').forEach(p => { p.classList.remove('hl', 'ul'); const k = p.dataset.k; const m = S.my.marks[k] || S.my.marks[k.split(':').pop()]; if (m) p.classList.add(m); });
    onEdit();
  }
  document.querySelectorAll('.bible .v.sel').forEach(p => p.classList.remove('sel'));
  selected.clear(); hideTool();
}

let CAL = null;
$('#dateLabel').onclick = async () => {
  if (!S) return;
  const ck = 'nqt.cal.' + normKey(KEY);
  CAL = CAL || store.get(ck);
  let [y, m] = S.date.split('-').map(Number);
  const sc = sheet(`<div id="calBox"></div><div class="row"><button class="btn sec" data-close>닫기</button></div>`);
  const draw = () => {
    const data = CAL || { dates: [], written: [], today: localToday() };
    const has = new Set(data.dates), wr = new Set(data.written);
    const first = data.dates[0] || data.today, minYM = first.slice(0, 7), maxYM = data.today.slice(0, 7);
    const ym = `${y}-${String(m).padStart(2, '0')}`;
    const start = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
    let cells = '일월화수목금토'.split('').map(w => `<div class="w">${w}</div>`).join('') + '<div></div>'.repeat(start);
    for (let d = 1; d <= days; d++) {
      const ds = `${ym}-${String(d).padStart(2, '0')}`;
      const cls = [ds === data.today ? 'today' : '', ds === S.date ? 'cur' : '', wr.has(ds) ? 'wr' : ''].join(' ');
      cells += `<button class="${cls}" data-d="${ds}" ${has.has(ds) && ds <= data.today ? '' : 'disabled'}>${d}</button>`;
    }
    sc.querySelector('#calBox').innerHTML = `
      <div class="cal-h"><button id="cPrev" ${ym <= minYM ? 'disabled' : ''} aria-label="이전 달">‹</button><b>${y}년 ${m}월</b><button id="cNext" ${ym >= maxYM ? 'disabled' : ''} aria-label="다음 달">›</button></div>
      <div class="cal">${cells}</div>
      <div class="cal-legend"><span><i></i>묵상 쓴 날</span><span><em></em>오늘</span></div>
      ${CAL ? '' : '<p class="muted" style="text-align:center;margin-top:10px">날짜를 불러오는 중…</p>'}`;
    sc.querySelector('#cPrev').onclick = () => { if (--m < 1) { m = 12; y--; } draw(); };
    sc.querySelector('#cNext').onclick = () => { if (++m > 12) { m = 1; y++; } draw(); };
    sc.querySelectorAll('.cal button[data-d]:not(:disabled)').forEach(b => b.onclick = () => { sc.remove(); load(b.dataset.d); });
  };
  draw();
  try { const r = await api('calendar'); CAL = { dates: r.dates, written: r.written, today: r.today }; store.set(ck, CAL); if (document.body.contains(sc)) draw(); }
  catch(e){ if (!CAL) toast('달력을 불러오지 못했어요'); }
};

  }
  // 예전 미리보기 모드에서 남은 가짜 코드는 지워요
  if (!DEMO && normKey(store.get('nqt.key')) === 'DEMOA23456') store.del('nqt.key');
  KEY = store.get('nqt.key');
  if (!KEY) return showWelcome();
  const cached = store.get(dayKey(localToday()));
  if (cached && cached.user && cached.user.status === '승인') { ME = cached.user; startApp(); return; }   // 바로 열기
  showLoading();
  api('day', {date: ''}).then(r => { ME = r.user; startApp(r); }).catch(e => {
    if (handleAuthError(e)) return;
    showGate(`<div class="panel" style="margin-top:28px"><h3>연결하지 못했어요</h3><p>${esc(e.message || '인터넷 연결을 확인해 주세요.')}</p><button class="btn pri" id="retry">다시 시도</button></div>`);
    $('#retry').onclick = () => location.reload();
  });
})();

/* ═════════ 미리보기용 가짜 서버 (config.js에 주소를 넣으면 쓰이지 않아요) ═════════ */
function demoApi(action, p){
  const D = window.__demo || (window.__demo = { status: /pending/.test(location.search) ? '대기' : '승인', notes: {}, network: /nonet/.test(location.search) ? '' : '이혜은NET', auto: /auto/.test(location.search), linked: /linked/.test(location.search) });
  const board = { network:'이혜은NET', head:'QT', titleFormat:'{월}/{일}({요일}) {제목} ({범위})', writeUrl:'about:blank', writeUrlMobile:'about:blank' };
  const prof = () => ({ name:'예진', status:D.status, network:D.network, networks:['이혜은NET','○○NET'], board: D.network ? Object.assign({}, board, {network:D.network}) : null, auto:D.auto, naverLinked:D.linked });
  const today = localToday();
  const refs = [[22,40],[22,41],[23,1],[23,2],[23,3],[23,4],[23,5],[23,6]];
  const day = date => ({ user: prof(), date: date || today, today, prev: (date || today) > '2026-10-01' ? '2026-10-14' : '', next: date && date < today ? today : '',
    my: D.notes[date || today] || { word:'', god:'', wrapup:'', tongdokDone:false, updatedAt:'', marks:{} },
    qt: { dateLabel:'2026년 10월 13일 화요일', title:'오늘 묵상의 제목이 여기에 들어가요', range:'민 22:40-23:6',
      prayer:'여는 기도 문장이 이 자리에 들어가요.', heading:'본문 머리말',
      verses: refs.map(([c,n]) => ({c, n, text:'새번역 본문 ' + c + '장 ' + n + '절 내용이 이 자리에 표시돼요. 긴 절은 자연스럽게 줄바꿈 됩니다.'})),
      versions: { GAE: refs.map(([c,n]) => ({c, n, text:'개역개정 ' + c + '장 ' + n + '절 본문'})), EASY: refs.map(([c,n]) => ({c, n, text:'쉬운성경 ' + c + '장 ' + n + '절 본문'})), NIV: refs.map(([c,n]) => ({c, n, text:'NIV text of ' + c + ':' + n})) },
      notes:'주석 내용이 들어가요.', summary:'본문요약이 들어가요.', guide:'묵상을 돕는 글이 들어가요.',
      wrapup:'말씀을 묵상하며 깨닫고 느낀 점, 기도하거나 실천하고 싶은 것을 적어 봅시다.', tongdok:'고전 17장' } });
  return new Promise(res => setTimeout(() => {
    if (action === 'request') { D.status = '대기'; D.network = p.network; res({ ok:true, key:'DEMOA-23456', user:{ name:p.name, status:'대기' } }); }
    else if (action === 'me') res({ ok:true, user: prof() });
    else if (action === 'setNetwork') { D.network = p.network; res({ ok:true, user: prof() }); }
    else if (action === 'calendar') res({ ok:true, dates:['2026-10-01','2026-10-02','2026-10-05','2026-10-12','2026-10-13','2026-10-14','2026-10-15'], written:['2026-10-12','2026-10-14'], today:'2026-10-15' });
    else if (action === 'networks') res({ ok:true, networks:['이혜은NET','○○NET'] });
    else if (action === 'naverAuthUrl') res({ ok:true, url:'about:blank' });
    else if (action === 'naverUnlink') { D.linked = false; res({ ok:true, user: prof() }); }
    else if (action === 'post') { const ps = { text:'10/13 16:30', url:'about:blank' }; (D.notes[p.date] = D.notes[p.date] || {}).posted = ps; res({ ok:true, posted: ps, headNote:'말머리(QT)는 카페에서 확인해 주세요.' }); }
    else if (action === 'day' || action === 'refetch') res(Object.assign({ ok:true }, day(p.date)));
    else if (action === 'highlights') res({ ok:true, items: Object.keys(D.notes).filter(d => Object.keys(D.notes[d].marks || {}).length).map(d => {
        const q = day(d).qt; return { date:d, title:q.title, range:q.range, verses:q.verses.filter(v => D.notes[d].marks[v.n]).map(v => Object.assign({type:D.notes[d].marks[v.n]}, v)) }; }) });
    else if (action === 'save') { D.notes[p.date] = Object.assign({}, p.data, {updatedAt:'10/13 14:00'}); res({ ok:true, updatedAt:'10/13 14:00' }); }
    else res({ ok:true });
  }, 150));
}
